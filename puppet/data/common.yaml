---
# ==============================================================================
# Puppet 8 Hiera Common Data — Campus Lost and Found Portal
# Environment: production
#
# This file stores durable configuration values managed by CI/CD and Puppet.
# Application deployments atomically update 'lostandfound::image' here on
# the Master, ensuring that subsequent agent runs preserve the deployed
# version rather than reverting to a hardcoded default.
# ==============================================================================

# Application container image reference (updated by CI/CD deployment jobs)
lostandfound::image: 'ghcr.io/ragnarstark79/campus.lost.and.found.portal:sha-0bf459f'

# GHCR visibility flag (false = public package, true = authenticated private pull)
lostandfound::image_is_private: false

# Host TCP port exposed on EC2
lostandfound::host_port: 5001

# Container internal TCP port (Flask)
lostandfound::container_port: 5000

# Application deployment directories
lostandfound::app_dir: '/opt/lostandfound'
lostandfound::data_dir: '/opt/lostandfound/data'

# Container environment
lostandfound::flask_env: 'production'

# Deployment status and metadata (dynamically updated by CI/CD on Master)
lostandfound::deployment_status: 'Successful'
lostandfound::deployment_message: 'Successfully deployed through CI/CD pipeline. Puppet Agent pulled and applied the latest configuration from Puppet Master.'
lostandfound::deployment_timestamp_utc: '2026-11-18T14:15:00Z'
lostandfound::deployment_commit: '0bf459f'
lostandfound::deployment_commit_message: 'feat(infra): complete Phase 1-5 AWS, Puppet 8, and CI/CD deployment pipeline'
lostandfound::deployment_image_tag: 'sha-0bf459f'
lostandfound::deployment_workflow_run: 'production'
