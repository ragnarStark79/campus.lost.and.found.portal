name: CI/CD Pipeline — Build, Test & Publish to GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Principle of least privilege: default read-only token across the workflow.
permissions:
  contents: read

# Cancel superseded runs on pull requests without interrupting main branch publishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, Type-Check & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Flake8 linter
        run: flake8 app/ tests/ --max-line-length=100

      - name: Run Mypy type checker
        run: mypy app/ --ignore-missing-imports

      - name: Run Pytest suite
        run: python -m pytest tests/ -v

  docker:
    name: Build Docker Image & Publish to GHCR
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      image_tag: ${{ steps.version.outputs.tag }}
      image_ref: ${{ steps.image.outputs.name }}:${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase GHCR image name
        id: image
        run: |
          IMAGE_NAME="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Compute immutable commit image tag
        id: version
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate Docker image metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build Docker image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          load: true
          push: false
          tags: campus-lostandfound:ci-test
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test Docker container (/ and /health)
        run: |
          cleanup() {
            docker rm -f ci_smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name ci_smoke \
            -p 5001:5000 \
            -e FLASK_ENV=production \
            -e SECRET_KEY=ci-smoke-test-secret \
            campus-lostandfound:ci-test

          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:5001/health >/dev/null; then
              break
            fi
            sleep 1
          done

          echo "=== /health response ==="
          curl -sf http://127.0.0.1:5001/health
          echo ""

          HOME_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5001/)
          echo "=== / status: ${HOME_CODE} ==="
          if [ "${HOME_CODE}" != "200" ]; then
            docker logs ci_smoke
            exit 1
          fi

      - name: Log in to GitHub Container Registry (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy_app:
    name: Deploy Application via Puppet (Mac Self-Hosted Runner)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'ragnarStark79'
    runs-on: [self-hosted, macOS, ARM64, puppet-deploy]
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SSH Prerequisites and EC2 Reachability
        id: preflight
        env:
          MASTER_IP: ${{ secrets.MASTER_PUBLIC_IP }}
          AGENT_IP: ${{ secrets.AGENT_PUBLIC_IP }}
          KNOWN_HOSTS_DATA: ${{ secrets.KNOWN_HOSTS }}
          SSH_KEY_DATA: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$MASTER_IP" ]; then
            echo "::error::Required secret MASTER_PUBLIC_IP is missing or empty." >&2
            exit 1
          fi
          if [ -z "$AGENT_IP" ]; then
            echo "::error::Required secret AGENT_PUBLIC_IP is missing or empty." >&2
            exit 1
          fi
          if [ -z "$SSH_KEY_DATA" ]; then
            echo "::error::Required secret SSH_PRIVATE_KEY is missing or empty." >&2
            exit 1
          fi
          if [ -z "$KNOWN_HOSTS_DATA" ]; then
            echo "::error::Required secret KNOWN_HOSTS is missing or empty." >&2
            exit 1
          fi

          # Create isolated temporary SSH directory under runner.temp with 0700 permissions
          SSH_DIR="${RUNNER_TEMP}/ssh_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$SSH_DIR"
          chmod 0700 "$SSH_DIR"

          # Write private key (0400) and verified known_hosts (0600)
          KEY_FILE="${SSH_DIR}/deploy_key.pem"
          printf "%s\n" "$SSH_KEY_DATA" > "$KEY_FILE"
          chmod 0400 "$KEY_FILE"

          KNOWN_HOSTS_FILE="${SSH_DIR}/known_hosts"
          printf "%s\n" "$KNOWN_HOSTS_DATA" > "$KNOWN_HOSTS_FILE"
          chmod 0600 "$KNOWN_HOSTS_FILE"

          echo "ssh_dir=$SSH_DIR" >> "$GITHUB_OUTPUT"
          echo "key_file=$KEY_FILE" >> "$GITHUB_OUTPUT"
          echo "known_hosts_file=$KNOWN_HOSTS_FILE" >> "$GITHUB_OUTPUT"
          echo "SSH credentials successfully written to isolated ephemeral directory."

      - name: Deploy Durable Version to Master and Apply Catalog on Agent
        env:
          MASTER_IP: ${{ secrets.MASTER_PUBLIC_IP }}
          AGENT_IP: ${{ secrets.AGENT_PUBLIC_IP }}
          KEY_FILE: ${{ steps.preflight.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.preflight.outputs.known_hosts_file }}
          TARGET_IMAGE: ${{ needs.docker.outputs.image_ref }}
        run: |
          echo "Executing durable application deployment..."
          echo "Target image reference: $TARGET_IMAGE"
          bash puppet/scripts/orchestrate-phase4.sh --ssh-deploy-app \
            "$MASTER_IP" \
            "$AGENT_IP" \
            "$TARGET_IMAGE" \
            "$KEY_FILE" \
            "$KNOWN_HOSTS_FILE"

      - name: Cleanup Ephemeral SSH Credentials
        if: always()
        run: |
          SSH_DIR="${{ steps.preflight.outputs.ssh_dir }}"
          if [ -n "$SSH_DIR" ] && [ -d "$SSH_DIR" ]; then
            echo "Removing ephemeral SSH credentials directory: $SSH_DIR"
            rm -rf "$SSH_DIR"
            echo "Ephemeral SSH credentials removed."
          fi
